<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Driver Station</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <!-- Top connection bar -->
    <connection-bar></connection-bar>

  <div class="dashboard-layout">
    <!-- Top grid for video + arena -->
    <section class="top-row">
      <video-panel></video-panel>
      <arena-panel></arena-panel>
      <rover-visual-panel></rover-visual-panel>
    </section>

    <!-- Main grid for core cards -->
    <main class="bottom-row">
      <estop-panel></estop-panel>
      <telemetry-panel></telemetry-panel>
      <queue-panel></queue-panel>
      <bandwidth-panel></bandwidth-panel>
    </main>
  </div>

  <div class="wheel-row">
    <div id="wheel_fl" class="wheel-card">
      <h3>Front Left</h3>
      <div>RPS: <span class="rps">—</span></div>
      <div>Cmd: <span class="cmd">—</span></div>
      <div>Current: <span class="current">—</span></div>
      <div>Temp: <span class="temp">—</span></div>
      <div>Status: <span class="fault">—</span></div>
    </div>

    <div id="wheel_fr" class="wheel-card">
      <h3>Front Right</h3>
      <div>RPS: <span class="rps">—</span></div>
      <div>Cmd: <span class="cmd">—</span></div>
      <div>Current: <span class="current">—</span></div>
      <div>Temp: <span class="temp">—</span></div>
      <div>Status: <span class="fault">—</span></div>
    </div>

    <div id="wheel_rl" class="wheel-card">
      <h3>Rear Left</h3>
      <div>RPS: <span class="rps">—</span></div>
      <div>Cmd: <span class="cmd">—</span></div>
      <div>Current: <span class="current">—</span></div>
      <div>Temp: <span class="temp">—</span></div>
      <div>Status: <span class="fault">—</span></div>
    </div>

    <div id="wheel_rr" class="wheel-card">
      <h3>Rear Right</h3>
      <div>RPS: <span class="rps">—</span></div>
      <div>Cmd: <span class="cmd">—</span></div>
      <div>Current: <span class="current">—</span></div>
      <div>Temp: <span class="temp">—</span></div>
      <div>Status: <span class="fault">—</span></div>
    </div>
  </div>

  <div class="faults-panel">
  <h3>Kraken Fault Lookup</h3>

  <table class="fault-table">
    <thead>
      <tr>
        <th>Motor</th>
        <th>Fault</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="fault_table_body"></tbody>
  </table>
</div>

    <!-- Controller + Rover panels -->
    <controller-panel></controller-panel>
    <!-- rover-visual-panel></rover-visual-panel -->

    <!-- JS entrypoint: loads components, then your old scripts -->
    <script src="/components/chart.js"></script>
    <script type="module" src="main.js"></script>
  </body>
</html>
