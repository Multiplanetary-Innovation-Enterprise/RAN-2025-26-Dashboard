<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Driver Station</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <connection-bar></connection-bar>

    <div class="dashboard-layout">
      <!-- Everything in .top-row must fit on screen without scrolling -->
      <section class="top-row">
        <video-panel></video-panel>
        <div class="side-stack">
          <estop-panel></estop-panel>
          <div class="mini-row">
            <rover-visual-panel></rover-visual-panel>
            <arena-panel></arena-panel>
          </div>
        </div>
      </section>

      <main class="bottom-row">
        <bandwidth-panel></bandwidth-panel>
      </main>
    </div>

    <div class="wheel-row">
      <wheel-card wheel="fl" label="Front Left"></wheel-card>
      <wheel-card wheel="fr" label="Front Right"></wheel-card>
      <wheel-card wheel="rl" label="Rear Left"></wheel-card>
      <wheel-card wheel="rr" label="Rear Right"></wheel-card>
    </div>

    <div class="faults-panel">
      <h3>Kraken Fault Lookup</h3>
      <table class="fault-table">
        <thead>
          <tr>
            <th>Motor</th>
            <th>Fault</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="fault_table_body"></tbody>
      </table>
    </div>

    <controller-panel></controller-panel>

    <!-- Chart.js must be a classic script: bandwidth-panel.js uses the global Chart -->
    <script src="components/chart.js"></script>
    <script type="module" src="main.js"></script>
  </body>
</html>
